<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    @font-face {
      font-family: "Fraunces";
      src: url("../fonts/fraunces-variable.woff") format("woff");
      font-weight: 100 900;
      font-style: normal;
    }
    @font-face {
      font-family: "Fraunces";
      src: url("../fonts/fraunces-italic-variable.woff") format("woff");
      font-weight: 100 900;
      font-style: italic;
    }
    @font-face {
      font-family: "Source Sans 3";
      src: url("../fonts/source-sans-3-variable.woff") format("woff");
      font-weight: 200 900;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1200px;
      height: 630px;
      background: #f4efe6;
      color: #1c1814;
      font-family: "Source Sans 3", sans-serif;
      overflow: hidden;
    }
    .frame {
      width: 1200px;
      height: 630px;
      padding: 64px 72px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand svg { width: 56px; height: 56px; }
    .name {
      font-family: "Fraunces", serif;
      font-size: 34px;
      font-weight: 580;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .sub {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #5c554c;
    }
    h1 {
      font-family: "Fraunces", serif;
      font-size: 76px;
      font-weight: 530;
      font-variation-settings: "SOFT" 50, "opsz" 96, "WONK" 0;
      letter-spacing: -0.038em;
      line-height: 1.02;
      max-width: 18ch;
    }
    h1 em {
      font-style: italic;
      color: #b4451a;
      font-weight: 480;
    }
    .foot {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      color: #5c554c;
      font-size: 24px;
    }
    .url { font-weight: 620; color: #1c1814; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="brand">
      <svg viewBox="0 0 48 48" fill="none">
        <rect width="48" height="48" rx="12" fill="#241F1A"/>
        <rect x="12" y="8" width="24" height="23" rx="4" fill="#F4EFE6"/>
        <path d="M12 13.5 L24 21 L36 13.5" stroke="#B4451A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M11 36.5 C15.5 42.5 32.5 42.5 37 36.5" stroke="#C56A3A" stroke-width="1.9" stroke-linecap="round"/>
        <path d="M14.5 34 C18 38.5 30 38.5 33.5 34" stroke="#E8D9C8" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="name">ShipNest</div>
        <div class="sub">Supply</div>
      </div>
    </div>
    <h1>Mailers in quantities that <em>actually</em> make sense.</h1>
    <div class="foot">
      <span>Poly &amp; padded mailers for small online shops</span>
      <span class="url">shipnestsupply.com</span>
    </div>
  </div>
</body>
</html>
